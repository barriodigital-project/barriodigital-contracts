openapi: 3.0.3

info:
  title: BarrioDigital Crews API
  version: 1.0.0

servers:
  - url: http://localhost:8083

paths:

  /api/v1/crews:

    get:
      summary: Listar cuadrillas
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de cuadrillas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Crew'
        '401':
          description: No autenticado
        '500':
          description: Error interno

    post:
      summary: Crear cuadrilla
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrew'

      responses:
        '201':
          description: Cuadrilla creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '400':
          description: Solicitud inválida
        '403':
          description: Sin permisos
        '500':
          description: Error interno


  /api/v1/crew-assignments:

    post:
      summary: Asignar cuadrilla a un trámite
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrewAssignment'

      responses:
        '201':
          description: Asignación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewAssignment'
        '400':
          description: Solicitud inválida
        '404':
          description: Cuadrilla no encontrada
        '409':
          description: Cuadrilla no disponible
        '500':
          description: Error interno

    get:
      summary: Listar asignaciones
      security:
        - bearerAuth: []

      parameters:
        - name: requestId
          in: query
          required: false
          schema:
            type: string
            format: uuid

        - name: crewId
          in: query
          required: false
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Lista de asignaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrewAssignment'
        '401':
          description: No autenticado
        '500':
          description: Error interno


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CreateCrew:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        available:
          type: boolean
          default: true

    Crew:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        available:
          type: boolean

    CreateCrewAssignment:
      type: object
      required:
        - requestId
        - crewId
      properties:
        requestId:
          type: string
          format: uuid
        crewId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time

    CrewAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        crewId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - ASIGNADA
            - EN_TERRENO
            - COMPLETADA