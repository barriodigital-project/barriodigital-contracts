openapi: 3.0.3

info:
  title: BarrioDigital Requests API
  version: 1.0.0

servers:
  - url: http://localhost:8081

paths:

  /api/v1/requests:

    post:
      summary: Crear trámite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '201':
          description: Trámite creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: Solicitud inválida
        '401':
          description: No autenticado
        '500':
          description: Error interno

    get:
      summary: Listar trámites
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequestStatus'

        - name: procedureTypeId
          in: query
          required: false
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Lista de trámites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
        '401':
          description: No autenticado
        '403':
          description: Sin permisos
        '500':
          description: Error interno


  /api/v1/requests/me:

    get:
      summary: Obtener mis trámites
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Trámites del usuario autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
        '401':
          description: No autenticado
        '500':
          description: Error interno


  /api/v1/requests/{id}:

    get:
      summary: Obtener trámite
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Trámite encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: No autenticado
        '403':
          description: Sin permisos
        '404':
          description: Trámite no encontrado
        '500':
          description: Error interno


  /api/v1/requests/{id}/status:

    patch:
      summary: Cambiar estado de trámite
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestStatus'

      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: Solicitud inválida
        '401':
          description: No autenticado
        '403':
          description: Sin permisos
        '404':
          description: Trámite no encontrado
        '409':
          description: Cambio de estado no permitido
        '500':
          description: Error interno


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CreateRequest:
      type: object
      required:
        - procedureTypeId
        - description
        - address
      properties:
        procedureTypeId:
          type: string
          format: uuid
        description:
          type: string
        address:
          type: string

    UpdateRequestStatus:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/RequestStatus'

    RequestStatus:
      type: string
      enum:
        - INGRESADO
        - ADMITIDO
        - EN_GESTION
        - EN_TERRENO
        - RESUELTO
        - RECHAZADO

    Request:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trackingCode:
          type: string
        procedureTypeId:
          type: string
          format: uuid
        citizenId:
          type: string
        description:
          type: string
        address:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        assignedCrewId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time