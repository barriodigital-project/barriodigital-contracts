openapi: 3.0.3

info:
  title: BarrioDigital BFF API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:

  /api/v1/requests:

    get:
      summary: Listar trámites
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de trámites

    post:
      summary: Crear trámite
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'

      responses:
        '201':
          description: Trámite creado


  /api/v1/requests/me:

    get:
      summary: Obtener mis trámites
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de trámites


  /api/v1/requests/{id}:

    get:
      summary: Obtener trámite
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Trámite encontrado
        '404':
          description: Trámite no encontrado


  /api/v1/requests/{id}/status:

    patch:
      summary: Cambiar estado de trámite
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestStatus'

      responses:
        '200':
          description: Estado actualizado
        '409':
          description: Cambio de estado no permitido


  /api/v1/procedure-types:

    get:
      summary: Listar tipos de trámite
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de tipos de trámite

    post:
      summary: Crear tipo de trámite
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcedureType'

      responses:
        '201':
          description: Tipo de trámite creado


  /api/v1/crews:

    get:
      summary: Listar cuadrillas
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de cuadrillas


  /api/v1/crew-assignments:

    post:
      summary: Asignar cuadrilla a trámite
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrewAssignment'

      responses:
        '201':
          description: Asignación creada


  /api/v1/audit/requests/{requestId}/timeline:

    get:
      summary: Obtener timeline de trámite
      security:
        - bearerAuth: []

      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Timeline del trámite


  /api/v1/reports/kpis:

    get:
      summary: Obtener indicadores
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Indicadores generales


  /api/v1/reports/requests-by-status:

    get:
      summary: Obtener trámites por estado
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Trámites agrupados por estado


  /api/v1/reports/top-procedure-types:

    get:
      summary: Obtener tipos de trámite más solicitados
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Ranking de tipos de trámite


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CreateRequest:
      type: object
      required:
        - procedureTypeId
        - description
        - address
      properties:
        procedureTypeId:
          type: string
          format: uuid
        description:
          type: string
        address:
          type: string

    UpdateRequestStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - INGRESADO
            - ADMITIDO
            - EN_GESTION
            - EN_TERRENO
            - RESUELTO
            - RECHAZADO

    CreateProcedureType:
      type: object
      required:
        - name
        - description
        - dailyQuota
      properties:
        name:
          type: string
        description:
          type: string
        dailyQuota:
          type: integer
        requirements:
          type: array
          items:
            type: string

    CreateCrewAssignment:
      type: object
      required:
        - requestId
        - crewId
      properties:
        requestId:
          type: string
          format: uuid
        crewId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time