openapi: 3.0.3

info:
  title: BarrioDigital Catalog API
  version: 1.0.0

servers:
  - url: http://localhost:8082

paths:

  /api/v1/procedure-types:

    get:
      summary: Listar tipos de trámite
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de tipos de trámite
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcedureType'
        '401':
          description: No autenticado
        '500':
          description: Error interno

    post:
      summary: Crear tipo de trámite
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcedureType'

      responses:
        '201':
          description: Tipo de trámite creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureType'
        '400':
          description: Solicitud inválida
        '401':
          description: No autenticado
        '403':
          description: Sin permisos
        '500':
          description: Error interno


  /api/v1/procedure-types/{id}:

    get:
      summary: Obtener tipo de trámite
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Tipo de trámite encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureType'
        '404':
          description: Tipo de trámite no encontrado

    put:
      summary: Actualizar tipo de trámite
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcedureType'

      responses:
        '200':
          description: Tipo de trámite actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureType'
        '400':
          description: Solicitud inválida
        '403':
          description: Sin permisos
        '404':
          description: Tipo de trámite no encontrado
        '500':
          description: Error interno


  /api/v1/procedure-types/{id}/availability:

    get:
      summary: Consultar disponibilidad de cupo
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Disponibilidad consultada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '404':
          description: Tipo de trámite no encontrado


  /api/v1/procedure-types/{id}/quota:

    patch:
      summary: Actualizar cupo disponible
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuota'

      responses:
        '200':
          description: Cupo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureType'
        '400':
          description: Solicitud inválida
        '404':
          description: Tipo de trámite no encontrado
        '409':
          description: Cupo no disponible


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CreateProcedureType:
      type: object
      required:
        - name
        - description
        - dailyQuota
      properties:
        name:
          type: string
        description:
          type: string
        dailyQuota:
          type: integer
          minimum: 0
        requirements:
          type: array
          items:
            type: string

    UpdateProcedureType:
      type: object
      required:
        - name
        - description
        - dailyQuota
      properties:
        name:
          type: string
        description:
          type: string
        dailyQuota:
          type: integer
          minimum: 0
        requirements:
          type: array
          items:
            type: string

    UpdateQuota:
      type: object
      required:
        - availableQuota
      properties:
        availableQuota:
          type: integer
          minimum: 0

    ProcedureType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        dailyQuota:
          type: integer
        availableQuota:
          type: integer
        requirements:
          type: array
          items:
            type: string
        active:
          type: boolean

    AvailabilityResponse:
      type: object
      properties:
        procedureTypeId:
          type: string
          format: uuid
        dailyQuota:
          type: integer
        availableQuota:
          type: integer
        available:
          type: boolean