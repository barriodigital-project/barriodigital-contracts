openapi: 3.0.3

info:
  title: BarrioDigital Report API
  version: 1.0.0

servers:
  - url: http://localhost:8087

paths:

  /api/v1/reports/kpis:

    get:
      summary: Obtener indicadores generales
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Indicadores generales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'
        '401':
          description: No autenticado
        '403':
          description: Sin permisos
        '500':
          description: Error interno


  /api/v1/reports/requests-by-status:

    get:
      summary: Obtener trámites por estado
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Trámites agrupados por estado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestsByStatusResponse'
        '403':
          description: Sin permisos
        '500':
          description: Error interno


  /api/v1/reports/top-procedure-types:

    get:
      summary: Obtener tipos de trámite más solicitados
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Ranking de tipos de trámite
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcedureTypeReportResponse'
        '403':
          description: Sin permisos
        '500':
          description: Error interno


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    KpiResponse:
      type: object
      properties:
        totalRequests:
          type: integer
        ingresados:
          type: integer
        admitidos:
          type: integer
        enGestion:
          type: integer
        enTerreno:
          type: integer
        resueltos:
          type: integer
        rechazados:
          type: integer

    RequestsByStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - INGRESADO
            - ADMITIDO
            - EN_GESTION
            - EN_TERRENO
            - RESUELTO
            - RECHAZADO
        total:
          type: integer

    ProcedureTypeReportResponse:
      type: object
      properties:
        procedureTypeId:
          type: string
          format: uuid
        total:
          type: integer